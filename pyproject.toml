[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shield-orchestrator"
version = "0.1.0"
description = "Multi-Agent Security Orchestration Framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.14.2",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
packages = ["shield_orchestrator"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
